[package]
name = "skattr-core"
description = "Skattr protocol library: identity, transport, MLS, storage, delivery."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "skattr_core"

[dependencies]
# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Crypto
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake2 = "0.10"
rand = { workspace = true }
rand_core = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }

# Encoding
bip39 = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde-big-array = { workspace = true }
toml = { workspace = true }
base32 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

# Storage
rusqlite = { workspace = true }
age = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }

# Transport
snow = { workspace = true }
arti-client = { workspace = true }
tor-cell = { workspace = true }
tor-hsservice = { workspace = true }
tor-hscrypto = { workspace = true }
tor-llcrypto = { workspace = true }
tor-rtcompat = { workspace = true }
safelog = { workspace = true }

# MLS
openmls = { workspace = true }
openmls_traits = { workspace = true }
openmls_rust_crypto = { workspace = true }
openmls_basic_credential = { workspace = true }
tls_codec = { workspace = true }

# Error / logging / misc
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
regex = { version = "1", default-features = false, features = ["std"] }
parking_lot = { workspace = true }
directories = { workspace = true }

# TypeScript codegen
ts-rs = { workspace = true }

# Optional: QR rendering
qrcode = { workspace = true, optional = true }
# Optional: fuzzing harness support
arbitrary = { workspace = true, optional = true }
libc = "0.2.185"

# Password strength scoring
zxcvbn = { version = "3", default-features = false }
img-parts = "0.3"

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tracing-subscriber = { workspace = true }
serde_json = "1"

[features]
default = ["qr"]
qr = ["dep:qrcode"]
fuzzing = ["dep:arbitrary"]
test-harness = []

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }
