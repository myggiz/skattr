[package]
name = "skattr-cli"
description = "Skattr command-line client."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "skattr"
