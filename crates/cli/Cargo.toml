tracing-subscriber = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
rpassword = "7"
qrcode = { version = "0.14", default-features = false }
serde_json = "1.0.149"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
