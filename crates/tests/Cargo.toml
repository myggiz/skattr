[package]
name = "skattr-tests"
description = "Cross-crate integration tests for Skattr."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
skattr-core = { path = "../core", features = ["test-harness"] }
# default-features = false so the test-harness consumer doesn't pull
# Arti through skattr-mailbox; the real-Tor smoke test pulls
# `arti-client` + `tor-rtcompat` directly below.
skattr-mailbox = { path = "../mailbox", default-features = false }

async-trait = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
zeroize = { workspace = true }

# Real-Tor smoke test (`mailbox_real_tor.rs`) uses these directly to
# drive a client-side Arti runtime. Other tests use
# `skattr_core::test_exports::TorRuntime` which already wraps these.
arti-client = { workspace = true }
tor-rtcompat = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
