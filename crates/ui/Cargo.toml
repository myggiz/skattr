[package]
name = "skattr-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license = "GPL-3.0-or-later"
description = "Tauri 2 + SvelteKit desktop UI for Skattr"
publish = false

[lints]
workspace = true

# Matches the upstream Tauri app template. Tauri picks dev-vs-production from
# this feature (`tauri`'s build.rs: `let dev = !custom_protocol`): without it a
# binary loads `devUrl` instead of the bundled frontend, so it compiles, lints,
# reports the right version, and cannot render the UI (#183).
#
# Deliberately NOT a default feature — enabling it by default would break
# `cargo tauri dev`, which needs dev mode. `cargo tauri build` passes it; a bare
# `cargo build` does not, and `build.rs` warns when that would ship a dud.
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
skattr-core = { path = "../core" }
tauri = { version = "=2.11.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { workspace = true }
serde.workspace = true
serde_json = "1"
zeroize.workspace = true
parking_lot.workspace = true
anyhow = "1"
notify-rust = { version = "4", default-features = false, features = ["dbus"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "skattr-ui"
path = "src/main.rs"
