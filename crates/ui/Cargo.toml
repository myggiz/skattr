[package]
name = "skattr-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license = "GPL-3.0-or-later"
description = "Tauri 2 + SvelteKit desktop UI for Skattr"
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.0", features = [] }

[dependencies]
skattr-core = { path = "../core" }
tauri = { version = "=2.11.0", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { workspace = true }
serde.workspace = true
serde_json = "1"
zeroize.workspace = true
parking_lot.workspace = true
anyhow = "1"
notify-rust = { version = "4", default-features = false, features = ["dbus"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "skattr-ui"
path = "src/main.rs"
