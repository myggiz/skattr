[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/mailbox",
    "crates/cli",
    "crates/tests",
    "crates/ui",
]
exclude = ["crates/core/fuzz", "crates/mailbox/fuzz"]

[workspace.package]
version = "0.1.12"
edition = "2021"
rust-version = "1.75"
authors = ["Myggiz B.V. <hello@myggiz.net>"]
repository = "https://github.com/myggiz/skattr"
homepage = "https://skattr.org"

[workspace.lints.rust]
# Unsafe code is forbidden across the workspace. The sole exception is
# `crates/core/src/daemon/ipc/server/windows.rs`, which must call Win32 FFI
# to retrieve the process user SID. That module carries `#![allow(unsafe_code)]`
# to make the exception explicit. We use "deny" here (not "forbid") so that
# the one Windows-FFI module can locally opt in with `#![allow(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"
# Phase 0 scaffolding: most module implementations are `todo!()` stubs, so
# `pub(crate)` items and re-exports are legitimately "dead" until Phase 1
# wires them up. Remove these allows at the start of Phase 1.
dead_code = "allow"
unused_imports = "allow"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "allow"
unimplemented = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
async-trait = "0.1"

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Encoding
bip39 = "2"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-big-array = "0.5"
toml = "0.8"
base32 = "0.5"
base64 = "0.22"
hex = "0.4"

# Storage
# Constrained by arti-dirmgr: rusqlite >=0.36,<0.39 (verified 2026-04).
rusqlite = { version = "0.38", features = ["bundled"] }
age = { version = "0.11", features = ["armor"] }
tar = "0.4"
flate2 = "1"

# Tor / Noise — pinned to the newest published versions at workspace bootstrap.
# These APIs move fast; revisit every phase exit.
# `experimental-api` and `onion-service-cli-extra` are unstable upstream
# features (flagged with `__is_experimental`). They may break between
# minor Arti releases. Used ONLY for:
#   experimental-api:
#     - (historic) TorClient::launch_onion_service_with_hsid — no longer
#       called after the Phase 0.C cleanup; kept enabled because some
#       transitively-used APIs also ride this flag.
#   onion-service-cli-extra:
#     - TorClient::keymgr (transport/tor.rs, inject_hs_secret) — for
#       the "slot already exists?" probe before we insert our seed-
#       derived HS key.
# On every Arti version bump, re-audit these usages. Grep command:
#   rg 'keymgr|_with_hsid|launch_onion_service' crates/core
arti-client = { version = "0.41", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service", "experimental-api", "onion-service-cli-extra"] }
tor-cell = "0.41"
tor-hsservice = "0.41"
tor-hscrypto = "0.41"
tor-llcrypto = "0.41"
safelog = "0.8"
tor-rtcompat = { version = "0.41", features = ["tokio", "rustls"] }
snow = { version = "0.9", features = ["default-resolver"] }

# MLS — OpenMLS 0.8.x ecosystem.
openmls = "0.8"
openmls_traits = "0.5"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
tls_codec = "0.4"

# CLI / errors / logging
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "registry"] }
tracing-appender = "0.2"
regex = { version = "1", default-features = false, features = ["std"] }

# Optional
qrcode = { version = "0.14" }
arbitrary = { version = "1", features = ["derive"] }
directories = "5"
sd-notify = "0.4"

# Test helpers
proptest = "1"
tempfile = "3"

# UI / codegen
ts-rs = { version = "9", default-features = false, features = ["serde-compat", "no-serde-warnings"] }
parking_lot = "0.12"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
