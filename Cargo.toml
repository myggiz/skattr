[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/mailbox",
    "crates/cli",
    "crates/tests",
]
exclude = ["crates/core/fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
authors = ["Myggiz AB <hello@myggiz.net>"]
repository = "https://github.com/myggiz/skattr"
homepage = "https://skattr.org"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# Phase 0 scaffolding: most module implementations are `todo!()` stubs, so
# `pub(crate)` items and re-exports are legitimately "dead" until Phase 1
# wires them up. Remove these allows at the start of Phase 1.
dead_code = "allow"
unused_imports = "allow"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "allow"
unimplemented = "warn"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures = "0.3"
async-trait = "0.1"

# Crypto
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# Encoding
bip39 = "2"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde-big-array = "0.5"
toml = "0.8"
base32 = "0.5"
base64 = "0.22"
hex = "0.4"

# Storage
# Constrained by arti-dirmgr: rusqlite >=0.36,<0.39 (verified 2026-04).
rusqlite = { version = "0.38", features = ["bundled"] }
age = { version = "0.11", features = ["armor"] }

# Tor / Noise — pinned to the newest published versions at workspace bootstrap.
# These APIs move fast; revisit every phase exit.
arti-client = { version = "0.41", default-features = false, features = ["tokio", "rustls", "onion-service-client", "onion-service-service"] }
tor-hsservice = "0.41"
tor-rtcompat = { version = "0.41", features = ["tokio", "rustls"] }
snow = { version = "0.9", features = ["default-resolver"] }

# MLS — OpenMLS 0.8.x ecosystem.
openmls = "0.8"
openmls_traits = "0.5"
openmls_rust_crypto = "0.5"

# CLI / errors / logging
clap = { version = "4", features = ["derive", "env"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Optional
qrcode = { version = "0.14" }
arbitrary = { version = "1", features = ["derive"] }
directories = "5"

# Test helpers
proptest = "1"
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = 3
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = true
strip = "none"
