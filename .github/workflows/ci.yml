name: CI

# Runs on every PR into master, plus manual dispatch.
#
# This was `workflow_dispatch`-only while the repo was private, to conserve
# GitHub Actions minutes (#82). The repo is public now and every job below
# uses a standard GitHub-hosted runner, which is free and unmetered for public
# repositories — so the reason for the on-demand cadence is gone and CI is a
# real gate again. The local gate stays useful for fast iteration before
# pushing; it is no longer the *only* verification.
#
# Deliberately NOT on every branch push: a PR run (plus a re-run on each push
# to that PR) is the useful signal. `workflow_dispatch` is kept for running a
# check against a branch before opening a PR, or before a release.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to a PR cancels the previous run for that PR — the older result
# is worthless once the branch moves, and this avoids piling up concurrent
# jobs on a branch that is being iterated on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

# Platform coverage (intentional):
#   - CI runs ubuntu-latest only. Windows-only compile/lint errors (e.g. a
#     `#[cfg(windows)]` item needing its own doc comment) are caught by the
#     local Windows build loop on myggdesk before a release is tagged, so the
#     ubuntu-only CI gap is covered by the workflow, not by an extra CI runner.
#   - macOS is not built or tested anywhere (no Mac hardware). The macOS runtime
#     seams remain in the code (buildable from source), but no .dmg is shipped.
#   - release.yml builds the signed .msi on windows-latest at tag time, so the
#     Windows artifact is still validated in the release pipeline.
jobs:
  check:
    name: fmt / clippy / test / build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: |
          . "$HOME/.cargo/env"
          cargo fmt --all --check

      - name: clippy
        run: |
          . "$HOME/.cargo/env"
          cargo clippy --workspace --exclude skattr-ui --all-targets --all-features -- -D warnings

      - name: test
        run: |
          . "$HOME/.cargo/env"
          cargo test --workspace --exclude skattr-ui --features test-harness

      - name: build skattr-cli
        run: |
          . "$HOME/.cargo/env"
          cargo build -p skattr-cli

  ui:
    name: ui (skattr-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri 2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Activate pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('crates/ui/src-svelte/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Generate ts-rs bindings
        run: cargo test -p skattr-core --features test-harness

      - name: Install frontend deps
        working-directory: crates/ui/src-svelte
        run: pnpm install --frozen-lockfile

      - name: Build SvelteKit frontend
        working-directory: crates/ui/src-svelte
        run: pnpm build

      - name: Unit tests (vitest)
        working-directory: crates/ui/src-svelte
        run: pnpm test

      - name: Type check (svelte-check, 0 errors / 0 warnings)
        working-directory: crates/ui/src-svelte
        run: pnpm check

      - name: Install Playwright browser
        working-directory: crates/ui/src-svelte
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright, mock backend)
        working-directory: crates/ui/src-svelte
        run: pnpm test:e2e

      - name: Clippy (skattr-ui)
        run: cargo clippy -p skattr-ui --all-targets --all-features -- -D warnings

      - name: Build (skattr-ui)
        run: cargo build -p skattr-ui --all-targets

      - name: Test (skattr-ui)
        run: cargo test -p skattr-ui --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
