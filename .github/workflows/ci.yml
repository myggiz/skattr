name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt / clippy / test / build (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: |
          . "$HOME/.cargo/env"
          cargo fmt --all --check

      - name: clippy
        run: |
          . "$HOME/.cargo/env"
          cargo clippy --workspace --exclude skattr-ui --all-targets --all-features -- -D warnings

      - name: test
        run: |
          . "$HOME/.cargo/env"
          cargo test --workspace --exclude skattr-ui --features test-harness

      - name: build skattr-cli
        run: |
          . "$HOME/.cargo/env"
          cargo build -p skattr-cli

  ui:
    name: ui (skattr-ui)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri 2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Activate pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('crates/ui/src-svelte/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Generate ts-rs bindings
        run: cargo test -p skattr-core --features test-harness

      - name: Install frontend deps
        working-directory: crates/ui/src-svelte
        run: pnpm install --frozen-lockfile

      - name: Build SvelteKit frontend
        working-directory: crates/ui/src-svelte
        run: pnpm build

      - name: Unit tests (vitest)
        working-directory: crates/ui/src-svelte
        run: pnpm test

      - name: Clippy (skattr-ui)
        run: cargo clippy -p skattr-ui --all-targets --all-features -- -D warnings

      - name: Build (skattr-ui)
        run: cargo build -p skattr-ui --all-targets

      - name: Test (skattr-ui)
        run: cargo test -p skattr-ui --all-targets

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
