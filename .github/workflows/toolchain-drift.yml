# SPDX-License-Identifier: GPL-3.0-or-later
name: toolchain-drift

# Early warning for a new Rust stable — deliberately kept OFF the PR path.
#
# ci.yml pins the toolchain to rust-toolchain.toml (#81, #240) so a freshly
# released clippy can no longer break a PR that changed no Rust. The price of
# that pin is silence: without this job nobody learns a new lint exists until
# someone bumps the pin by hand, and by then the lints have piled up and the
# bump has become a chore attached to unrelated work.
#
# So this runs the same clippy gate on FLOATING @stable, weekly. It is NOT a
# required check and NOT triggered by pull_request: a failure here is a
# heads-up addressed to the maintainer, never a merge blocker. Red means "the
# next pin bump has work attached" — information worth having *before* the
# bump rather than during it.
on:
  schedule:
    # Mondays 06:00 UTC. Rust ships stable on Thursdays, so a Monday run
    # surfaces a new release's lints within a few days of it landing.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: toolchain-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-on-stable:
    name: clippy on floating @stable (advisory, non-blocking)
    runs-on: ubuntu-latest
    # Installing a toolchain does NOT make it active: rust-toolchain.toml
    # overrides whatever the action installed, so the first version of this
    # workflow installed 1.99.0 and then linted the pinned 1.95.0 — passing
    # green while testing nothing at all. RUSTUP_TOOLCHAIN outranks the file
    # (and a directory override), so it is what actually puts this job ahead
    # of the pin. Removing it silently makes the whole workflow inert.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v6

      # Deliberately @stable, NOT the pinned rust-toolchain.toml version:
      # running ahead of the pin is this workflow's entire purpose.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: drift

      - name: Report the gap between stable and the pin
        run: |
          active=$(rustup show active-toolchain | awk '{print $1}')
          echo "active:  $active"
          echo "pinned:  $(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustc --version
          cargo clippy --version
          # Guard against the exact regression this workflow already shipped
          # once: if the pin wins, every step below lints the pinned toolchain
          # and reports a meaningless green. Checking for `stable-*` rather
          # than "differs from the pin" stays correct when the pin is bumped
          # all the way up to current stable, where no drift is the truth.
          case "$active" in
            stable-*) ;;
            *)
              echo "::error::expected the floating stable toolchain, got '$active' — rust-toolchain.toml is winning and this job would test nothing" >&2
              exit 1
              ;;
          esac

      # skattr-ui is excluded to skip the Tauri system-dependency install this
      # advisory job does not need. It shares skattr-core, where new lints have
      # actually bitten, so core coverage is unaffected; a new lint in
      # skattr-ui's own code would wait until the pin bump.
      - name: clippy (workspace, excluding skattr-ui)
        run: cargo clippy --workspace --exclude skattr-ui --all-targets --all-features -- -D warnings
