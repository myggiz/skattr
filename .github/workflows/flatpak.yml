# SPDX-License-Identifier: GPL-3.0-or-later
name: flatpak

# Lightweight manifest rot-check for the in-repo Flatpak manifest.
#
# This validates that the manifest still *parses* (well-formed YAML, loadable
# module structure) via `flatpak-builder --show-manifest`. It does NOT compile
# the app under the sandbox.
#
# Why parse-only: the manifest pins the org.freedesktop.*//23.08 runtime, whose
# rust-stable SDK extension is frozen at Cargo 1.81 — too old for the current
# dependency tree (it needs edition2024 / Rust >= 1.85). A full sandbox build
# therefore fails today and requires a runtime bump (23.08 -> 24.08) plus
# toolchain re-validation. That is real packaging work, deferred to v1.1
# alongside the (also-deferred) Flathub publication — see docs/build/flatpak.md.
# Until then, this job keeps a cheap signal that the manifest hasn't been
# grossly broken, without taxing CI with an unshippable ~GB sandbox build.

# On-demand only — the weekly cron + master-push triggers are disabled to
# conserve GitHub Actions minutes during the sub-version fix cycle. Run the
# manifest rot-check manually (Actions tab → flatpak → "Run workflow") when
# touching the Flatpak manifest or before a release. See CLAUDE.md.
on:
  workflow_dispatch: {}

# Serialize per-ref so an overlapping push/schedule can't run two at once.
concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-parse:
    name: flatpak manifest parse-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - name: Validate the manifest parses (no build, no runtime needed)
        run: |
          # --show-manifest loads and resolves the manifest (YAML + module
          # structure + includes) and prints it as JSON. It does NOT pull the
          # runtime/SDK or compile anything, so it is fast and needs no network.
          # A full build-validation is deferred to v1.1 (runtime bump required).
          flatpak-builder --show-manifest \
            packaging/flatpak/net.myggiz.skattr.yml > /dev/null
          echo "Manifest parses OK."
