name: regen-lockfile-probe

# THROWAWAY — delete this file with the fix for #147.
#
# The `ui` job is broken at `pnpm install --frozen-lockfile`
# (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH): `patchedDependencies` was declared in
# both package.json and pnpm-workspace.yaml, and the lockfile's recorded value
# matched neither. The config half is fixed on this branch; the lockfile has to
# be regenerated by a working pnpm, which the maintainer's Windows box cannot do
# (pnpm 10 registers the project via a symlink into its store, which needs
# privileges that box does not have).
#
# So: regenerate on the Linux runner, prove the whole `ui` gate passes with the
# result, and upload the lockfile as an artifact for review before it lands.

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  regen:
    name: regenerate pnpm-lock.yaml and prove the ui gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Tauri 2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ui

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # Pinned exactly, unlike the `ui` job's floating `pnpm@10`, so the
      # lockfile this produces is attributable to one known version.
      - name: Activate pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm --version

      - name: Regenerate the lockfile
        working-directory: crates/ui/src-svelte
        run: pnpm install --no-frozen-lockfile

      - name: Show the lockfile diff
        run: git --no-pager diff -- crates/ui/src-svelte/pnpm-lock.yaml

      # The actual acceptance criterion from #147: a clean frozen install.
      - name: Verify a frozen install now succeeds
        working-directory: crates/ui/src-svelte
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile

      # The esrap patch exists for a reason — a regeneration that silently
      # dropped it would look green and be wrong.
      - name: Verify the esrap patch is still applied
        working-directory: crates/ui/src-svelte
        run: |
          grep -q "patchedDependencies" pnpm-lock.yaml \
            || { echo "patchedDependencies vanished from the lockfile"; exit 1; }
          test -d node_modules/esrap \
            || { echo "esrap not installed"; exit 1; }
          echo "--- patch we expect to be applied ---"
          cat patches/esrap@1.4.9.patch

      # Everything the real `ui` job gates on, so the artifact is not just
      # syntactically valid but actually works.
      - name: Generate ts-rs bindings
        run: cargo test -p skattr-core --features test-harness

      - name: Build SvelteKit frontend
        working-directory: crates/ui/src-svelte
        run: pnpm build

      - name: Unit tests (vitest)
        working-directory: crates/ui/src-svelte
        run: pnpm test

      - name: Type check (svelte-check, 0 errors / 0 warnings)
        working-directory: crates/ui/src-svelte
        run: pnpm check

      - name: Install Playwright browser
        working-directory: crates/ui/src-svelte
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests (Playwright, mock backend)
        working-directory: crates/ui/src-svelte
        run: pnpm test:e2e

      - name: Upload the regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: crates/ui/src-svelte/pnpm-lock.yaml
          if-no-files-found: error
