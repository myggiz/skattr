[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# All four ignores below are Arti-transitive advisories with no safe
# upgrade available in the arti-client 0.41 dependency tree. Revisit
# each when Arti bumps:
#   - RUSTSEC-2024-0436: `paste 1.0.15` unmaintained; Arti → fs-mistrust
#     → pwd-grp → paste. Project is archived upstream; no drop-in fix.
#   - RUSTSEC-2026-0097: `rand` + custom logger unsoundness; depends on
#     a combination we do not hit in production. Arti's internal use.
#   - RUSTSEC-2023-0071: `rsa` Marvin timing sidechannel. Arti uses
#     rsa transitively; we never construct RSA private keys ourselves.
#   - RUSTSEC-2026-0104: `rustls-webpki` CRL-parsing panic. Arti
#     transitive; we do not feed attacker-controlled CRLs.
#   - RUSTSEC-2026-0173: `proc-macro-error2` unmaintained (the maintained
#     fork of proc-macro-error, itself RUSTSEC-2024-0370). Build-time
#     proc-macro dep via `getset → tor-dircommon → arti-client`; not in the
#     shipped artifact. No fix until Arti drops getset. Pre-existing on master.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0097",
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0173",
    # The next block is Tauri 2.x transitive — gtk-rs GTK3 bindings on
    # Linux + a handful of other crates that ship with the WebKit2GTK
    # backend. All are "unmaintained" advisories rather than active
    # vulnerabilities. Tauri's roadmap moves to a non-GTK backend on
    # Linux; revisit when Tauri ships GTK4 / wry-only support.
    #   - RUSTSEC-2024-0411..0420: gtk3, gdk, gdkx11, atk, gdk-sys, etc.
    #   - RUSTSEC-2024-0370: proc-macro-error (used by glib-macros).
    #   - RUSTSEC-2025-0075..0100: unic-* (used by Tauri's text-handling).
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    "RUSTSEC-2025-0075",
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # quick-xml XML-*parsing* DoS advisories (fixed in quick-xml >= 0.41).
    # Two copies are hard-pinned below 0.41 by the Tauri 2.11.0 stack and
    # cannot be bumped without a Tauri upgrade (`tauri = "=2.11.0"`):
    #   - 0.39.2 via plist -> tauri-utils/tauri (requires "^0.39.2")
    #   - 0.37.5 via tauri-winrt-notification -> notify-rust (requires "^0.37")
    # Not reachable in our usage: both advisories require *parsing*
    # attacker-controlled XML (a start tag with many duplicate attributes /
    # namespace decls). Our paths only *emit* XML — plist handling is
    # macOS-bundle build-time (and macOS is no longer built), and
    # winrt-notification builds Windows toast XML from our own notification
    # content, it does not parse untrusted XML. Revisit when Tauri bumps and
    # the transitive quick-xml pins reach >= 0.41.
    #   - RUSTSEC-2026-0194: quadratic run time on duplicate attribute names.
    #   - RUSTSEC-2026-0195: unbounded namespace-declaration allocation (NsReader).
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "OpenSSL",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps (e.g. `skattr-core = { path = "../core" }`)
# inevitably have a wildcard version — they are unpublished sibling
# crates pinned by path, not by version. Exempt them explicitly.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
